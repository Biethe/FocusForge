name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # CI split rule (CLAUDE.md §4.4): APKs are built on x64; the NDK cross-compiles
  # arm64 native code here in later phases. Never install the Android SDK on the
  # arm64 runner.
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The native build compiles llama.cpp, pinned as a shallow submodule.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      # Pinned toolchain: the native build is the highest-risk part of the project and
      # the NDK version is part of the reproduction recipe. No-op when already present.
      - name: Install the pinned NDK and CMake
        run: |
          echo y | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify permissions (privacy rule — CAMERA only, INTERNET forbidden forever)
        run: |
          PERMS=$("$ANDROID_HOME"/build-tools/34.0.0/aapt2 dump permissions \
            app/build/outputs/apk/debug/app-debug.apk)
          echo "$PERMS"
          # Allowed: CAMERA + the androidx-generated app-private receiver permission.
          UNEXPECTED=$(echo "$PERMS" | grep "^uses-permission" \
            | grep -v "android.permission.CAMERA" \
            | grep -v "com.focusforge.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Unexpected permissions in APK: $UNEXPECTED"
            exit 1
          fi
          if echo "$PERMS" | grep -qi "INTERNET"; then
            echo "::error::INTERNET permission found — hard privacy rule violated"
            exit 1
          fi

      # native/CMakeLists.txt fails the build if an armv8.2+ *flag* reaches the compiler.
      # This checks the far more important thing: the actual instructions in the binary
      # that lands on the operator's Armv8.0-A phone. A SIGILL here is not a slow app,
      # it is a dead one, and it would only be discovered on the only device we have.
      - name: Verify the native library contains no post-Armv8.0 instructions
        run: |
          set -euo pipefail
          SO=$(find app/build/intermediates/cxx -name "libfocusforge_llm.so" -path "*arm64-v8a*" | head -1)
          if [ -z "$SO" ]; then echo "::error::libfocusforge_llm.so was not built"; exit 1; fi
          echo "Scanning $SO"
          OBJDUMP="$ANDROID_HOME"/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-objdump
          "$OBJDUMP" -d --no-show-raw-insn "$SO" > dis.txt
          echo "disassembled $(wc -l < dis.txt) lines"

          # dotprod (v8.2), i8mm (v8.6), bf16, SVE — none exist on an Exynos 7884B.
          BAD=$(grep -cwE '\s(sdot|udot|smmla|ummla|usmmla|bfdot|bfmmla|bfcvt)' dis.txt || true)
          SVE=$(grep -cE '\s(z[0-9]+\.[bhsd]|p[0-9]+/[mz])' dis.txt || true)
          echo "post-v8.0 SIMD instructions: $BAD ; SVE register uses: $SVE"
          if [ "$BAD" != "0" ] || [ "$SVE" != "0" ]; then
            grep -nwE '\s(sdot|udot|smmla|ummla|usmmla|bfdot|bfmmla|bfcvt)' dis.txt | head -20 || true
            echo "::error::Post-Armv8.0 instructions found — this APK would SIGILL on the A20e"
            exit 1
          fi

          # LSE atomics (v8.1) are allowed ONLY inside clang's outline-atomic helpers,
          # which branch on __aarch64_have_lse_atomics and fall back to ldxr/stxr.
          # Anywhere else they would execute unconditionally and trap.
          LSE_TOTAL=$(grep -cwE '\s(ldadd|ldaddal|ldaddl|ldaddа|swp|swpal|cas|casal|ldclr|ldset|ldeor)[a-z]*' dis.txt || true)
          if [ "$LSE_TOTAL" != "0" ]; then
            if ! grep -q "__aarch64_have_lse_atomics" dis.txt && \
               ! "$ANDROID_HOME"/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm \
                   "$SO" | grep -q "__aarch64_have_lse_atomics"; then
              echo "::error::LSE atomics present with no runtime guard — would SIGILL on the A20e"
              exit 1
            fi
            OUTSIDE=$(awk '/^[0-9a-f]+ <.*>:/ {fn=$0} /\s(ldadd|swp|cas|ldclr|ldset|ldeor)[a-z]*\s/ {if (fn !~ /__aarch64_/) print}' dis.txt | wc -l)
            if [ "$OUTSIDE" != "0" ]; then
              echo "::error::$OUTSIDE LSE atomic(s) outside the guarded outline-atomic helpers"
              exit 1
            fi
            echo "LSE atomics: $LSE_TOTAL, all inside guarded __aarch64_* helpers (safe)"
          fi
          echo "Armv8.0 baseline verified on the shipped binary."

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk focusforge-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focusforge-debug-apk
          path: focusforge-debug.apk

      - name: Publish rolling dev-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev build (rolling — always the newest main)"
          prerelease: true
          body: |
            Rolling debug build of the latest `main` commit (${{ github.sha }}).
            Download `focusforge-debug.apk` below directly on the phone's browser.
            Sideload install — expect a Play Protect warning, see README/PROGRESS.
          files: focusforge-debug.apk

  # CI split rule (CLAUDE.md §4.4): performance and signal work runs on Arm silicon.
  # `-PcoreOnly` drops :app from the Gradle build, so the Android SDK is never needed here
  # and never installed. :core is pure Kotlin/JVM by design, which is what makes this possible.
  core-tests:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Record the silicon these numbers were produced on
        run: |
          echo "=== uname ==="; uname -a
          echo "=== /proc/cpuinfo (Features line) ==="; grep -m1 Features /proc/cpuinfo || true

      - name: Run :core signal tests (unit + replay)
        run: ./gradlew -PcoreOnly :core:test --no-daemon

      - name: Prove no Android project was built here (CI split rule)
        run: |
          ./gradlew -PcoreOnly projects --no-daemon | tee projects.txt
          if grep -q "Project ':app'" projects.txt; then
            echo "::error:::app is part of the arm64 build — CI split rule violated"
            exit 1
          fi
          if [ -d app/build ]; then
            echo "::error::app/build was produced on the arm64 runner"
            exit 1
          fi
          echo "Only :core was built on this runner, as required."

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test/

  arm-probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Probe Arm silicon
        run: |
          {
            echo "=== date (UTC) ==="
            date -u
            echo
            echo "=== lscpu ==="
            lscpu
            echo
            echo "=== /proc/cpuinfo ==="
            cat /proc/cpuinfo
          } | tee probe-ci.txt

      - name: Upload probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: probe-ci
          path: probe-ci.txt
